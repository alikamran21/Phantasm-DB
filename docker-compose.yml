services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phantasm_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - FLASK_DEBUG=false
      - PORT=5000
    expose:
      - "5000"
    networks:
      - phantasm_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  webserver:
    image: nginx:1.27-alpine
    container_name: phantasm_webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/usr/share/nginx/html:ro
    networks:
      - phantasm_net
    depends_on:
      backend:
        condition: service_healthy

networks:
  phantasm_net:
    driver: bridge
