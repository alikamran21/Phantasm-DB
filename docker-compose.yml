# ── Phantasm-DB docker-compose.yml ───────────────────────────
# Two containers:
#   backend  — Python/Flask (port 5000, internal only)
#   webserver — Nginx (port 8080, public)

services:

  # ── Flask API backend ───────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phantasm_backend
    restart: unless-stopped
    env_file:
      - .env                          # loads DATABASE_URL and all secrets
    environment:
      - FLASK_DEBUG=false
      - PORT=5000
    expose:
      - "5000"                        # internal only — Nginx proxies to this
    networks:
      - phantasm_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Nginx web server / reverse proxy ───────────────────────
  webserver:
    image: nginx:1.27-alpine
    container_name: phantasm_webserver
    restart: unless-stopped
    ports:
      - "8080:8080"                   # access the app at http://localhost:8080
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # our custom config
      - ./:/usr/share/nginx/html:ro                       # serve ALL root HTML files
    networks:
      - phantasm_net
    depends_on:
      backend:
        condition: service_healthy

networks:
  phantasm_net:
    driver: bridge
