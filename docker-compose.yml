# docker-compose.yml
# ============================================================
# Phantasm-DB — Docker Compose stack (Neon PostgreSQL edition)
#
# The local PostgreSQL (db) service has been removed.
# DATABASE_URL in .env points directly to Neon.
#
# Usage:
#   docker compose up --build        # first run
#   docker compose up -d             # background mode
#   docker compose logs -f           # tail all logs
#   docker compose down              # stop containers
#   docker compose build --no-cache backend  # force rebuild
# ============================================================

version: "3.9"

networks:
  phantasm_net:
    driver: bridge

services:

  # ==========================================================================
  # backend — FastAPI + Uvicorn  (connects to Neon over SSL)
  # ==========================================================================
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile.backend
    container_name: phantasm_backend
    restart: unless-stopped

    env_file: .env

    environment:
      DATABASE_URL:      ${DATABASE_URL}
      JWT_SECRET_KEY:    ${JWT_SECRET_KEY}
      JWT_ALGORITHM:     ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      SMTP_HOST:         ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT:         ${SMTP_PORT:-587}
      SMTP_USE_TLS:      ${SMTP_USE_TLS:-true}
      SMTP_USERNAME:     ${SMTP_USERNAME}
      SMTP_PASSWORD:     ${SMTP_PASSWORD}
      SMTP_FROM_NAME:    ${SMTP_FROM_NAME:-Serenity Psychiatric Care}
      SMTP_FROM_EMAIL:   ${SMTP_FROM_EMAIL}
      APP_ENV:           ${APP_ENV:-production}
      APP_DEBUG:         ${APP_DEBUG:-false}
      ALLOWED_ORIGINS:   ${ALLOWED_ORIGINS:-http://localhost}
      RATE_LIMIT_REQUESTS:       ${RATE_LIMIT_REQUESTS:-30}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      OTP_EXPIRE_MINUTES:        ${OTP_EXPIRE_MINUTES:-5}
      MAX_FAILED_LOGINS:         ${MAX_FAILED_LOGINS:-5}
      HONEYPOT_SILENT:           ${HONEYPOT_SILENT:-true}
      HONEYPOT_LOG_PAYLOADS:     ${HONEYPOT_LOG_PAYLOADS:-true}
      ADMIN_SEED_EMAIL:          ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD:       ${ADMIN_SEED_PASSWORD}

    # ports:
    #   - "8000:8000"   # uncomment only for direct API debugging

    networks:
      - phantasm_net

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus:   "1.00"
          memory: "512M"

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"


  # ==========================================================================
  # frontend — Nginx static server + API reverse proxy
  # ==========================================================================
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile.frontend
    container_name: phantasm_frontend
    restart: unless-stopped

    ports:
      - "80:80"

    networks:
      - phantasm_net

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout:  5s
      retries:  3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus:   "0.25"
          memory: "128M"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
