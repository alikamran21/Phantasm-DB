# ── Phantasm-DB Nginx Configuration ──────────────────────────
# Serves static HTML on port 8080; proxies /api/* to the Flask backend.

server {
    listen 8080;
    server_name localhost;

    # ── Root: serve static HTML files ────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Serve any .html file directly (index, login, portals, etc.)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Serve Honeypot sub-directory
    location /Honeypot/ {
        try_files $uri $uri/ =404;
    }

    # ── /api/* → Flask backend ────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Forward the body (important for POST endpoints)
        proxy_request_buffering on;

        # Pass CORS headers through — the Flask handlers set them already
        proxy_pass_header  Access-Control-Allow-Origin;
        proxy_pass_header  Access-Control-Allow-Methods;
        proxy_pass_header  Access-Control-Allow-Headers;

        # Generous timeout for async DB operations
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Standard error pages ─────────────────────────────────
    error_page 404 /index.html;   # SPA fallback (redirect unknown routes to index)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
