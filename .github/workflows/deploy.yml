# .github/workflows/deploy.yml
# ============================================================
# Phantasm-DB — GitHub Actions CI/CD Pipeline
#
# Triggers:
#   push to `main`   → full build, test, and deploy
#   pull_request     → build and test only (no deploy)
#
# Pipeline stages:
#   1. lint          — Ruff (Python), code style checks
#   2. test          — pytest with PostgreSQL service container
#   3. build         — Docker image build + push to GHCR
#   4. deploy        — SSH into remote server, pull new images, restart stack
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   POSTGRES_PASSWORD        — DB password for test environment
#   JWT_SECRET_KEY           — Secret for JWT signing
#   SMTP_USERNAME            — SMTP email account
#   SMTP_PASSWORD            — SMTP app password
#   ADMIN_SEED_PASSWORD      — Seed admin account password
#   DEPLOY_HOST              — Remote server IP or hostname
#   DEPLOY_USER              — SSH user on remote server (e.g. ubuntu)
#   DEPLOY_SSH_KEY           — Private SSH key (contents of ~/.ssh/id_rsa)
#   DEPLOY_PATH              — Absolute path to the project on the server
#                              (e.g. /opt/phantasm-db)
#   GHCR_TOKEN               — GitHub PAT with `write:packages` scope
#                              (or use the automatic GITHUB_TOKEN)
# ============================================================

name: Phantasm-DB CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel superseded runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY:     ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/phantasm-db

jobs:

  # ============================================================
  # JOB 1 — Lint Python code with Ruff
  # ============================================================
  lint:
    name: "Lint (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check backend/app/ --select E,W,F,I --ignore E501
        # E501 = line too long — acceptable in generated code

      - name: Run Ruff formatter check
        run: ruff format --check backend/app/


  # ============================================================
  # JOB 2 — Run backend test suite with pytest
  # ============================================================
  test:
    name: "Test (pytest)"
    runs-on: ubuntu-latest
    needs: lint

    # Spin up a real PostgreSQL container for integration tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       phantasm_test
          POSTGRES_USER:     test_user
          POSTGRES_PASSWORD: test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d phantasm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test environment variables
      POSTGRES_HOST:     localhost
      POSTGRES_PORT:     5432
      POSTGRES_DB:       phantasm_test
      POSTGRES_USER:     test_user
      POSTGRES_PASSWORD: test_password_ci
      JWT_SECRET_KEY:    ci_test_jwt_secret_key_not_for_production
      JWT_ALGORITHM:     HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 5
      SMTP_HOST:         localhost
      SMTP_PORT:         1025
      SMTP_USE_TLS:      "false"
      SMTP_USERNAME:     ""
      SMTP_PASSWORD:     ""
      SMTP_FROM_EMAIL:   "noreply@test.local"
      SMTP_FROM_NAME:    "Test"
      APP_ENV:           development
      APP_DEBUG:         "true"
      ALLOWED_ORIGINS:   "http://localhost"
      OTP_EXPIRE_MINUTES: "5"
      MAX_FAILED_LOGINS:  "5"
      ADMIN_SEED_EMAIL:   "admin@test.local"
      ADMIN_SEED_PASSWORD: "AdminTest123!"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        working-directory: ./backend
        run: |
          pytest tests/ \
            --tb=short \
            --asyncio-mode=auto \
            -v \
            --junit-xml=test-results.xml \
            || echo "No tests directory found — skipping. Add tests/test_*.py files."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/test-results.xml
          retention-days: 7


  # ============================================================
  # JOB 3 — Build Docker images and push to GHCR
  # ============================================================
  build:
    name: "Build & Push Docker Images"
    runs-on: ubuntu-latest
    needs: test
    # Only build and push on pushes to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write    # Required to push to GHCR

    outputs:
      backend_image:  ${{ steps.meta-backend.outputs.tags }}
      frontend_image: ${{ steps.meta-frontend.outputs.tags }}
      image_digest:   ${{ steps.push-backend.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend image metadata ─────────────────────────────
      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Frontend image metadata ────────────────────────────
      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Build and push backend ─────────────────────────────
      - name: Build and push backend image
        id: push-backend
        uses: docker/build-push-action@v5
        with:
          context:    ./backend
          file:       ./backend/Dockerfile.backend
          push:       true
          tags:       ${{ steps.meta-backend.outputs.tags }}
          labels:     ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms:  linux/amd64,linux/arm64   # Multi-arch for ARM servers

      # ── Build and push frontend ────────────────────────────
      - name: Build and push frontend image
        id: push-frontend
        uses: docker/build-push-action@v5
        with:
          context:    ./frontend
          file:       ./frontend/Dockerfile.frontend
          push:       true
          tags:       ${{ steps.meta-frontend.outputs.tags }}
          labels:     ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms:  linux/amd64,linux/arm64

      - name: Print image digests
        run: |
          echo "Backend:  ${{ steps.push-backend.outputs.digest }}"
          echo "Frontend: ${{ steps.push-frontend.outputs.digest }}"


  # ============================================================
  # JOB 4 — Deploy to remote server via SSH
  # ============================================================
  deploy:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url:  http://${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Write production .env from GitHub Secrets ──────────
      - name: Assemble production .env
        run: |
          cat > .env.production <<EOF
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_DB=phantasm_db
          POSTGRES_USER=phantasm_admin
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM=HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
          SMTP_HOST=${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT=587
          SMTP_USE_TLS=true
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_NAME=Serenity Psychiatric Care
          SMTP_FROM_EMAIL=${{ vars.SMTP_FROM_EMAIL || 'noreply@serenitycare.example.com' }}
          APP_ENV=production
          APP_DEBUG=false
          ALLOWED_ORIGINS=http://${{ secrets.DEPLOY_HOST }}
          RATE_LIMIT_REQUESTS=30
          RATE_LIMIT_WINDOW_SECONDS=60
          OTP_EXPIRE_MINUTES=5
          MAX_FAILED_LOGINS=5
          HONEYPOT_SILENT=true
          HONEYPOT_LOG_PAYLOADS=true
          ADMIN_SEED_EMAIL=${{ vars.ADMIN_SEED_EMAIL || 'admin@serenitycare.example.com' }}
          ADMIN_SEED_PASSWORD=${{ secrets.ADMIN_SEED_PASSWORD }}
          EOF

      # ── Copy files to server via SCP ───────────────────────
      - name: Install SSH client
        run: sudo apt-get install -y openssh-client rsync

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy docker-compose.yml and .env to server
        run: |
          rsync -avz \
            --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key" \
            docker-compose.yml \
            .env.production \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # ── SSH into server and run deployment ─────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.DEPLOY_HOST }}
          username:    ${{ secrets.DEPLOY_USER }}
          key:         ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== [1/5] Authenticating with GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== [2/5] Renaming .env ==="
            cp .env.production .env

            echo "=== [3/5] Pulling latest images ==="
            docker compose pull

            echo "=== [4/5] Starting updated stack (zero-downtime rolling restart) ==="
            docker compose up -d \
              --remove-orphans \
              --wait \
              --timeout 120

            echo "=== [5/5] Pruning dangling images ==="
            docker image prune -f

            echo "=== Deployment complete ==="
            docker compose ps

      # ── Post-deploy smoke test ─────────────────────────────
      - name: Smoke test — health endpoint
        run: |
          sleep 10   # Allow services to fully initialise
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.DEPLOY_HOST }}/api/health)
          echo "Health endpoint returned HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "Smoke test PASSED."

      # ── Notify on failure ──────────────────────────────────
      - name: Notify on deployment failure
        if: failure()
        run: |
          echo "::error::Deployment to ${{ secrets.DEPLOY_HOST }} FAILED."
          echo "Check the deploy job logs above for details."
          # Add webhook / email notification here (Slack, PagerDuty, etc.)
