# frontend/nginx.conf
# ============================================================
# Phantasm-DB — Nginx reverse proxy configuration
#
# Topology:
#   Browser → Nginx (:80) → FastAPI backend (:8000)
#
# Key behaviours:
#   • Static HTML served directly from /usr/share/nginx/html
#   • /api/* requests proxied to backend container
#   • Security headers applied globally
#   • Access logs in JSON format for log aggregators
#   • Gzip compression for text assets
#   • Rate limiting at the Nginx layer (first line of defence)
# ============================================================

# ---------------------------------------------------------------------------
# Rate limiting zone — 10 MB shared memory, 30 req/min per IP
# Applied to /api/ location only so static files are not throttled.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # ---------------------------------------------------------------------------
    # Root — serve static HTML files
    # ---------------------------------------------------------------------------
    root  /usr/share/nginx/html;
    index login.html;

    # ---------------------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"             always;
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header X-XSS-Protection          "1; mode=block"          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://fonts.googleapis.com; "
        "style-src  'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com; "
        "font-src   'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; "
        "img-src    'self' data: https://www.transparenttextures.com; "
        "connect-src 'self';"
        always;

    # Remove server version from responses
    server_tokens off;

    # ---------------------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------------------
    gzip            on;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/xml;
    gzip_min_length 1000;
    gzip_vary       on;

    # ---------------------------------------------------------------------------
    # Static files — serve directly
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /login.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Honeypot pages — accessible only by the backend redirect logic,
    # but served as static files (the attacker's browser fetches them directly
    # because the frontend JS navigates to them).
    location /Honeypot/ {
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # API reverse proxy — forward to FastAPI backend
    # ---------------------------------------------------------------------------
    location /api/ {
        # Apply Nginx-level rate limiting (burst of 10 queued, no delay)
        limit_req zone=api_limit burst=10 nodelay;

        # Forward to backend Docker service
        proxy_pass         http://backend:8000;

        # Pass real client IP to FastAPI (used by security.py)
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — generous for long DB queries but bounded
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     60s;

        # Disable buffering so streaming responses work correctly
        proxy_buffering    off;

        # Remove server header from proxied responses
        proxy_hide_header  Server;
    }

    # Health check endpoint — used by Docker Compose healthcheck
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ---------------------------------------------------------------------------
    # Block common attack paths
    # ---------------------------------------------------------------------------
    location ~* \.(git|env|htaccess|htpasswd|DS_Store)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # ---------------------------------------------------------------------------
    # Custom error pages
    # ---------------------------------------------------------------------------
    error_page 404 /login.html;
    error_page 429 =429 '{"detail":"Rate limit exceeded. Try again shortly."}';
    error_page 500 502 503 504 /login.html;
}
