<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantasm SecureBank | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">

    <nav class="bg-blue-900 text-white p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="text-2xl font-bold tracking-wider">
                🏦 Phantasm <span class="font-light">SecureBank</span>
            </div>
            <div class="space-x-4 text-sm hidden sm:block">
                <a href="#" class="hover:text-blue-300">Personal</a>
                <a href="#" class="hover:text-blue-300">Business</a>
                <a href="#" class="hover:text-blue-300">About Us</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md border border-gray-200">
            
            <h2 class="text-2xl font-semibold text-gray-800 text-center mb-2">Secure Login</h2>
            <p class="text-sm text-gray-500 text-center mb-6">Access your accounts and investments securely.</p>

            <form action="/login" method="POST" class="space-y-5">
                
                <div>
                    <label for="account_id" class="block text-sm font-medium text-gray-700">Account ID or Username</label>
                    <input type="text" id="account_id" name="account_id" required 
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Enter your Account ID">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" name="password" required 
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                        placeholder="••••••••">
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-900"> Remember me </label>
                    </div>
                    <div class="text-sm">
                        <a href="#" class="font-medium text-blue-600 hover:text-blue-500"> Forgot password? </a>
                    </div>
                </div>

                <button type="submit" 
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-700 hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    Not a customer? <a href="#" class="font-medium text-blue-600 hover:text-blue-500">Open an account today</a>.
                </p>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-gray-400 py-6 text-center text-xs">
        <p>&copy; 2024 Phantasm SecureBank. All rights reserved.</p>
        <p class="mt-1">Member FDIC. Equal Housing Lender.</p>
    </footer>

</body>
</html>
